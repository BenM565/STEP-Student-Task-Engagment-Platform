{% extends "base.html" %}
{% block title %}Reset password · STEP{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5 class="mb-2">Forgot your password?</h5>
        <p class="small text-muted mb-3">Enter the email you signed up with and we'll send you a link to choose a new password.</p>
        <form method="post">
          {{ csrf_field() }}
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input id="email" name="email" type="email" class="form-control" required autocomplete="email" autofocus>
          </div>
          <div class="d-grid"><button class="btn btn-primary">Send reset link</button></div>
        </form>
        <hr>
        <p class="mb-0 small"><a href="{{ url_for('login') }}">Back to log in</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
