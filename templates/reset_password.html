{% extends "base.html" %}
{% block title %}Choose a new password · STEP{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5 class="mb-3">Choose a new password</h5>
        <form method="post">
          {{ csrf_field() }}
          <div class="mb-3">
            <label class="form-label" for="password">New password</label>
            <input id="password" name="password" type="password" class="form-control" required minlength="8" autocomplete="new-password" autofocus>
            <div class="form-text">At least 8 characters.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirm">Confirm new password</label>
            <input id="confirm" name="confirm" type="password" class="form-control" required minlength="8" autocomplete="new-password">
          </div>
          <div class="d-grid"><button class="btn btn-primary">Reset password</button></div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
