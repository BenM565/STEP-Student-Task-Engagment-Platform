{% extends "base.html" %}
{% block title %}Log in · STEP{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5 class="mb-3">Log in</h5>
        <form method="post" action="{{ url_for('login', next=request.args.get('next')) }}">
          {{ csrf_field() }}
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input id="email" name="email" type="email" class="form-control" required autocomplete="email" autofocus>
          </div>
          <div class="mb-2">
            <label class="form-label" for="password">Password</label>
            <input id="password" name="password" type="password" class="form-control" required autocomplete="current-password">
          </div>
          <div class="mb-3 text-end">
            <a class="small" href="{{ url_for('accounts.forgot_password') }}">Forgot password?</a>
          </div>
          <div class="d-grid">
            <button class="btn btn-primary">Log in</button>
          </div>
        </form>
        <hr>
        <p class="mb-0">No account? <a href="{{ url_for('register') }}">Create one</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
