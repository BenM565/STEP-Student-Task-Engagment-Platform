{% extends "base.html" %}
{% block title %}Change password · STEP{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5 class="mb-3">Change password</h5>
        <form method="post">
          {{ csrf_field() }}
          <div class="mb-3">
            <label class="form-label" for="current_password">Current password</label>
            <input id="current_password" name="current_password" type="password" class="form-control" required autocomplete="current-password">
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">New password</label>
            <input id="password" name="password" type="password" class="form-control" required minlength="8" autocomplete="new-password">
            <div class="form-text">At least 8 characters.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirm">Confirm new password</label>
            <input id="confirm" name="confirm" type="password" class="form-control" required minlength="8" autocomplete="new-password">
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-primary">Change password</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('profile') }}">Cancel</a>
          </div>
        </form>
        <p class="small text-muted mt-3 mb-0">Forgotten it? <a href="{{ url_for('accounts.forgot_password') }}">Reset it by email</a> (log out first).</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
