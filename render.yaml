# Render Blueprint for STEP (infrastructure as code).
#
# This mirrors the dashboard configuration so the deployment is reviewable in
# git and reproducible in a new Render account or region. Secrets are declared
# with `sync: false`: Render prompts for them at deploy time and they are never
# stored in the repository. See https://render.com/docs/blueprint-spec
#
# The existing service (configured in the dashboard) is not changed by this
# file; connect the repo as a Blueprint only when you want Render to manage the
# service from here.

services:
  - type: web
    name: step-platform
    runtime: python
    plan: free                      # match the plan of the live service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60
    healthCheckPath: /
    autoDeploy: true                # CI/CD: every push to the tracked branch redeploys
    envVars:
      # --- Core ---
      - key: SECRET_KEY
        generateValue: true         # Render generates a strong random value
      - key: DATABASE_URL
        fromDatabase:
          name: step-db
          property: connectionString
      - key: APP_URL
        sync: false                 # https://<service>.onrender.com
      - key: ADMIN_REGISTRATION_CODE
        sync: false
      # --- Email (HTTPS API; SMTP ports are blocked on free web services) ---
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        sync: false                 # "STEP Platform <no-reply@yourdomain.ie>"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_TASK_ALERT_MAX_RECIPIENTS
        value: "100"

databases:
  - name: step-db
    plan: free                      # match the plan of the live database
    databaseName: step
    user: step
